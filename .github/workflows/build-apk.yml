name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web and Android Assets
        run: |
          npm install
          node build.js

      - name: Setup Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Push Error Log to Git Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          git add gradle_output.txt
          git commit -m "Gradle Error Log"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git debug-log

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android/app/build/outputs -name "*.apk" -exec cp {} output/Dr-Akram-Clinic.apk \;
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Akram-Clinic-APK
          path: output/Dr-Akram-Clinic.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.6
          name: "Dr. Akram Clinic App v1.0.6 (APK)"
          body: "Official Android APK for Dr. Akram Clinic Patient Consultation Slip & 80mm Bluetooth Thermal Printer."
          files: output/Dr-Akram-Clinic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
